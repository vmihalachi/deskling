name: .NET

# The pure core builds and tests on Linux (every conformance vector); the Windows library is compiled on
# Linux too (EnableWindowsTargeting) and once more on a Windows runner, where its Win32 calls can be exercised.
on:
  push:
    branches:
      - master
    paths:
      - "dotnet/**"
      - "conformance/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "conformance/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check C# formatting (dotnet/.editorconfig)
        run: dotnet format whitespace dotnet --folder --verify-no-changes

      # Core and its tests only: Deskling.Windows needs MakePri.exe (Windows App SDK), so the windows job builds it.
      - name: Build
        run: dotnet build dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj -c Release

      - name: Core tests (conformance vectors)
        run: dotnet test dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj -c Release --no-build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Deskling.Windows
        run: dotnet build dotnet/Deskling.Windows/Deskling.Windows.csproj -c Release

name: .NET

# The pure packages (Deskling.Core, Deskling.Companion, Deskling.Companion.Shell, Deskling.Testing) build and test on Linux and Windows
# (every conformance vector); Deskling.Windows and Deskling.Windows.Companion build on the Windows runner, where their
# Win32 and WinRT calls can be exercised.
on:
  push:
    branches:
      - master
    paths:
      - "dotnet/**"
      - "conformance/**"
      - "Tests/DesklingCompanionTests/Resources/**"
      - "Tests/DesklingShellTests/Resources/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "conformance/**"
      - "Tests/DesklingCompanionTests/Resources/**"
      - "Tests/DesklingShellTests/Resources/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check C# formatting (dotnet/.editorconfig)
        run: dotnet format whitespace dotnet --folder --verify-no-changes

      # The pure packages and their tests only: Deskling.Windows needs MakePri.exe (Windows App SDK), so the windows
      # job builds it.
      - name: Build
        run: |
          dotnet build dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj -c Release
          dotnet build dotnet/Deskling.Companion.Tests/Deskling.Companion.Tests.csproj -c Release
          dotnet build dotnet/Deskling.Companion.Shell.Tests/Deskling.Companion.Shell.Tests.csproj -c Release

      - name: Core tests (conformance/scheduler)
        run: dotnet test dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj -c Release --no-build

      - name: Companion tests (conformance/companion)
        run: dotnet test dotnet/Deskling.Companion.Tests/Deskling.Companion.Tests.csproj -c Release --no-build

      - name: Companion shell tests (speech, delivery, signals, desktop layout)
        run: dotnet test dotnet/Deskling.Companion.Shell.Tests/Deskling.Companion.Shell.Tests.csproj -c Release --no-build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Deskling.Windows and Deskling.Windows.Companion
        run: |
          dotnet build dotnet/Deskling.Windows/Deskling.Windows.csproj -c Release
          dotnet build dotnet/Deskling.Windows.Companion/Deskling.Windows.Companion.csproj -c Release

      - name: Windows tests
        run: |
          dotnet test dotnet/Deskling.Windows.Tests/Deskling.Windows.Tests.csproj -c Release
          dotnet test dotnet/Deskling.Windows.Companion.Tests/Deskling.Windows.Companion.Tests.csproj -c Release

      # The same vectors under Windows' time zone database and math library.
      - name: Core, Companion and shell tests
        run: |
          dotnet test dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj -c Release
          dotnet test dotnet/Deskling.Companion.Tests/Deskling.Companion.Tests.csproj -c Release
          dotnet test dotnet/Deskling.Companion.Shell.Tests/Deskling.Companion.Shell.Tests.csproj -c Release

name: Kotlin

# The Kotlin side (kotlin/): ktlint over every source, then :core's and :testing's tests (every conformance vector among
# them) and the :android debug build, on a hosted Ubuntu runner, whose image carries the Android SDK.
on:
  push:
    branches:
      - master
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: "1.8.0"

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: ktlint
        run: |
          curl -sSL "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint" -o "$RUNNER_TEMP/ktlint"
          chmod a+x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "**/*.kt" "**/*.kts" "!**/build/**"

      - name: Tests and the Android build
        run: ./gradlew :core:test :testing:test :android:assembleDebug --console=plain

name: Tools

# Tests the Python tools in tools/ (standard library only, so no setup beyond the runner's python3).
on:
  push:
    branches:
      - master
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Test the tools (tools/tests/run.py)
        run: python3 tools/tests/run.py

      - name: Check the fixture art is current
        run: scripts/fixture-art.sh --check

name: Tools

# Tests the Python tools in tools/ (standard library only, so no setup beyond the runner's python3) and the
# @deskling/landing package (tools/landing, Node 24).
on:
  push:
    branches:
      - master
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Test the tools (tools/tests/run.py)
        run: python3 tools/tests/run.py

      - name: Check the fixture art is current
        run: scripts/fixture-art.sh --check

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/landing/package-lock.json

      - run: npm ci

      - name: Types, lint, format
        run: npx tsc --noEmit && npx vp check

      - name: Test
        run: npx vp test run

      - name: Pack (what npm would publish)
        run: npm pack --dry-run

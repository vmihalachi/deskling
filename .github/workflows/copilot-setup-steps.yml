name: Copilot setup steps

# Prepares GitHub Copilot's cloud coding agent (Ubuntu): the .NET 10 SDK and a restored Deskling.Core.Tests, so
# `dotnet test` works once the agent's firewall is up. Swift needs macOS; the agent verifies it through swift.yml
# (see AGENTS.md). Also runs when edited, so a broken setup shows up in the PR.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Copilot only picks up a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Deskling.Core.Tests
        run: dotnet restore dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj

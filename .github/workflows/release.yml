name: Release

# A vX.Y.Z tag versions both sides: this packs and pushes the NuGet packages (NUGET_API_KEY secret) and
# drafts a GitHub release with the matching CHANGELOG section. The Swift package needs nothing more than
# the tag itself. Run it from Actions with a version to have it create the tag on master (for sessions
# whose credentials can't push tags), or push the tag yourself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release, without the v (must match a CHANGELOG.md section)"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version from the tag or the input
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "DESKLING_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "DESKLING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Check CHANGELOG.md has the section and tag master (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          grep -q "^## $DESKLING_VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no '## $DESKLING_VERSION' section"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$DESKLING_VERSION" -m "Deskling $DESKLING_VERSION"
          git push origin "v$DESKLING_VERSION"
          echo "RELEASE_TAG=v$DESKLING_VERSION" >> "$GITHUB_ENV"

      - name: Tag from the push
        if: github.event_name != 'workflow_dispatch'
        run: echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj -c Release

      - name: Pack
        run: >
          dotnet pack dotnet/Deskling.Core/Deskling.Core.csproj dotnet/Deskling.Windows/Deskling.Windows.csproj
          -c Release -p:DesklingVersion=$DESKLING_VERSION -o dotnet/artifacts

      # Without the secret the packages still land on the GitHub release below; add NUGET_API_KEY (an API key from
      # nuget.org scoped to Deskling.*) and re-run this job to publish them.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY is not set: the packages were packed but not pushed to NuGet.org."
            exit 0
          fi
          dotnet nuget push "dotnet/artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$DESKLING_VERSION" '
            /^## / { on = ($2 == v || $2 == "[" v "]") ; next }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dotnet/artifacts/*.nupkg --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"

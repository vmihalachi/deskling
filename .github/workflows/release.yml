name: Release

# A vX.Y.Z tag versions both sides: this packs the NuGet packages, pushes them to NuGet.org through Trusted
# Publishing (OIDC: no stored key; nuget.org → your account → Trusted Publishing → a policy for repository
# vmihalachi/deskling and workflow file release.yml, plus the NUGET_USER repository variable set to your nuget.org
# username) and drafts a GitHub release with the matching CHANGELOG section. The Swift package needs nothing more than
# the tag itself; @deskling/landing (tools/landing) is staged on npm at the tag's version for an owner to approve, when
# tools/landing changed since the version npm has (see the version and npm jobs). Run it from Actions with a version to
# have it create the tag on master (for sessions whose credentials can't push tags), or push the tag yourself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release, without the v (must match a CHANGELOG.md section)"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Decides the version and whether @deskling/landing ships, and, for manual runs, puts the tag on this commit.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      landing: ${{ steps.landing.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the landing's diff

      - id: v
        name: Version from the tag or the input
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

      - name: Check CHANGELOG.md has the section and tag this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          v="${{ steps.v.outputs.version }}"
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          existing=$(git ls-remote --tags origin "refs/tags/v$v^{}" | cut -f1)
          [ -n "$existing" ] || existing=$(git ls-remote --tags origin "refs/tags/v$v" | cut -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$existing" ]; then
            git tag -a "v$v" -m "Deskling $v" && git push origin "v$v"
          elif [ "$existing" = "$GITHUB_SHA" ]; then
            echo "v$v already points here"
          else
            echo "v$v already exists at $existing (tags are protected and never move): release the next version"; exit 1
          fi

      # @deskling/landing ships only when tools/landing changed since the version npm has, so its versions skip the
      # releases that leave it alone. Compared with npm rather than the previous tag: a release whose landing was never
      # staged or approved is caught up by the next one, and a re-run after the approval stages nothing twice.
      - id: landing
        name: Whether tools/landing changed since npm's version
        run: |
          published=$(npm view @deskling/landing version 2>/dev/null || true)
          if [ -z "$published" ]; then
            changed=true; why="npm has no version of it (or didn't answer)"
          elif ! git rev-parse -q --verify "refs/tags/v$published" >/dev/null; then
            changed=true; why="npm's $published has no tag here"
          elif git diff --quiet "v$published" HEAD -- tools/landing; then
            changed=false; why="tools/landing is unchanged since $published, the version on npm: not staged"
          else
            changed=true; why="tools/landing changed since $published, the version on npm"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "@deskling/landing: $why" | tee -a "$GITHUB_STEP_SUMMARY"

  # Deskling.Core, Deskling.Companion, Deskling.Companion.Shell and Deskling.Testing: tests and the packages, on Linux.
  core:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet test dotnet/Deskling.Core.Tests/Deskling.Core.Tests.csproj -c Release
          dotnet test dotnet/Deskling.Companion.Tests/Deskling.Companion.Tests.csproj -c Release
          dotnet test dotnet/Deskling.Companion.Shell.Tests/Deskling.Companion.Shell.Tests.csproj -c Release

      - name: Pack Deskling.Core, Deskling.Companion, Deskling.Companion.Shell, Deskling.Testing
        run: |
          for project in Deskling.Core Deskling.Companion Deskling.Companion.Shell Deskling.Testing; do
            dotnet pack "dotnet/$project/$project.csproj" -c Release \
              -p:DesklingVersion=${{ needs.version.outputs.version }} -o dotnet/artifacts
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-core
          path: dotnet/artifacts/*.nupkg

  # Deskling.Windows and Deskling.Windows.Companion need the Windows App SDK's MakePri.exe, so they test and pack on
  # Windows.
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet test dotnet/Deskling.Windows.Tests/Deskling.Windows.Tests.csproj -c Release
          dotnet test dotnet/Deskling.Windows.Companion.Tests/Deskling.Windows.Companion.Tests.csproj -c Release

      - name: Pack Deskling.Windows, Deskling.Windows.Companion
        shell: bash
        run: |
          for project in Deskling.Windows Deskling.Windows.Companion; do
            dotnet pack "dotnet/$project/$project.csproj" -c Release \
              -p:DesklingVersion=${{ needs.version.outputs.version }} -o dotnet/artifacts
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-windows
          path: dotnet/artifacts/*.nupkg

  # @deskling/landing (tools/landing) at the tag's version: tested and packed here, staged on npm by `npm`. Skipped,
  # with `npm`, when tools/landing is unchanged since npm's version.
  landing:
    needs: version
    if: needs.version.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test and pack
        run: |
          npm ci
          npx tsc --noEmit && npx vp test run
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version
          mkdir -p "$GITHUB_WORKSPACE/npm"
          npm pack --pack-destination "$GITHUB_WORKSPACE/npm"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-landing
          path: npm/*.tgz

  # @deskling/landing to npm through Trusted Publishing (OIDC: no stored token), staged rather than published: nothing
  # goes live until an owner approves it with 2FA (npmjs.com → the package → Staged, or `npm stage approve <id>`).
  # npmjs.com holds one trusted publisher for the package: repository vmihalachi/deskling, workflow release.yml,
  # environment npm, stage publish only. Its own job, so only it can mint the token; re-run it if it fails.
  npm:
    needs: [version, core, windows, landing]
    if: needs.version.outputs.landing == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-landing
          path: npm

      # No registry-url: it writes a token line to .npmrc, and there is no token.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Stage @deskling/landing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install -g npm@^11.15.0  # staged publishing
          npm stage publish ./npm/*.tgz --access public --provenance  # ./: a bare npm/… reads as a GitHub repository
          {
            echo "@deskling/landing@$VERSION is staged on npm. Approve it with 2FA on npmjs.com (the package's Staged tab)"
            echo "or with \`npm stage list @deskling/landing\` and \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs when the landing was skipped as well as when it succeeded.
  publish:
    needs: [version, core, windows, landing]
    if: >-
      !cancelled() && needs.core.result == 'success' && needs.windows.result == 'success' &&
      (needs.landing.result == 'success' || needs.landing.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      DESKLING_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v7
        with:
          pattern: nupkg-*
          path: dotnet/artifacts
          merge-multiple: true

      # Trusted Publishing: GitHub's OIDC token is exchanged for a one-hour NuGet.org API key scoped to this run.
      # Without the NUGET_USER variable the packages still land on the GitHub release below; set it (and the
      # nuget.org policy) and re-run this workflow to publish them.
      - name: Log in to NuGet.org (Trusted Publishing)
        if: vars.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          ls -l dotnet/artifacts
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::Not pushed to NuGet.org: set the NUGET_USER repository variable to your nuget.org username and add a Trusted Publishing policy there for vmihalachi/deskling, workflow release.yml."
            exit 0
          fi
          dotnet nuget push "dotnet/artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The landing's tarball, when this release has one, rides along on the GitHub release.
      - uses: actions/download-artifact@v7
        if: needs.landing.result == 'success'
        with:
          name: npm-landing
          path: npm

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$DESKLING_VERSION" '
            /^## / { on = ($2 == v || $2 == "[" v "]") ; next }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dotnet/artifacts/*.nupkg)
          if [ -d npm ]; then assets+=(npm/*.tgz); fi
          if gh release view "v$DESKLING_VERSION" >/dev/null 2>&1; then
            gh release upload "v$DESKLING_VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$DESKLING_VERSION" "${assets[@]}" --title "v$DESKLING_VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

name: Release

# Releases are made on demand: Actions → Release → Run workflow, on master, with dry_run first: the version job prints
# the plan (the next version and why, whether NuGet and @laching/landing ship) and stops before it writes anything. One
# tag per release; the Swift package and the Kotlin build take the tag, NuGet and npm a new version only when their code
# changed since their last one. The plan is scripts/release.sh's, the same by hand: `plan` numbers the release from the
# pull requests merged since the last tag (a minor while 0.x, a major from 1.0, when one is labelled `breaking`, else a
# patch; the bump input overrides it, and nothing committed since the tag releases nothing), `nuget` whether the six
# packages changed since LachingVersion (dotnet/Directory.Build.props), `landing` whether tools/landing changed since
# npm's version.
#
# A real run commits `scripts/release.sh bump` to master as "X.Y.Z: release" and tags it vX.Y.Z in one atomic push
# (planning again on top when master moved meanwhile), after `scripts/verify.sh --version` has checked the version
# strings. When NuGet ships, it tests and packs the six packages at X.Y.Z and pushes them to NuGet.org through Trusted
# Publishing (OIDC: no stored key; nuget.org → your account → Trusted Publishing → a policy for repository
# vmihalachi/laching and workflow release.yml, plus the NUGET_USER repository variable set to your nuget.org username);
# when the landing ships, it publishes @laching/landing to npm (the landing and npm jobs). Then it makes the GitHub
# release, its notes generated from the merged pull requests' titles (grouped by .github/release.yml) with what shipped
# below them. Tags pushed with the workflow's token start no other workflow, so this run carries the release through and
# starts the site's deploy itself.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto: a minor while 0.x (a major from 1.0) when a pull request merged since the last tag is labelled breaking, else a patch"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Only print the plan (the version and why, whether NuGet and the landing ship) and stop"
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time; a run waiting behind it starts from master as it is then.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Plans the release and, unless it's a dry run, commits the bump and tags it. release is false when there is nothing
  # to release or on a dry run, and every other job skips.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read  # the merged pull requests' labels, for the plan
      actions: write  # the site's deploy after the bump
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      ref: ${{ steps.plan.outputs.ref }}
      nuget: ${{ steps.plan.outputs.nuget }}
      landing: ${{ steps.plan.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the plan
          ref: ${{ github.ref }}  # the branch as it is when the run starts, not when it was queued

      - id: plan
        name: Plan, then bump and tag (a dry run stops after the plan)
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "A release runs on master, not $GITHUB_REF (a dry run runs anywhere)"
            exit 1
          fi
          for attempt in 1 2 3; do
            plan=$(scripts/release.sh plan --bump "$BUMP")  # set -e stops here when it fails; inside the read it wouldn't
            read -r action version why <<< "$plan"
            if [ "$action" = none ]; then
              say "Nothing to release: $plan"
              out release false
              exit 0
            fi
            [ "$action" = release ] || { echo "scripts/release.sh plan said '$plan'"; exit 1; }
            previous=$(sed -n 's/.*public static let version = "\([^"]*\)".*/\1/p' Sources/LachingCore/Laching.swift)
            nuget=$(scripts/release.sh nuget "$version")
            landing=$(scripts/release.sh landing)
            say "Plan: $plan"
            say "NuGet: $nuget"
            say "@laching/landing: $landing"
            if [ "$DRY_RUN" = true ]; then
              say "Dry run: nothing was committed, tagged or published."
              out release false
              exit 0
            fi
            # Tags never move: a v$version already on origin stops the release before anything is written.
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
              echo "v$version already exists on origin (tags are protected and never move): fetch it and see what made it"
              exit 1
            fi
            scripts/release.sh bump "$version"
            scripts/verify.sh --version "$version"
            [ "$(scripts/release.sh nuget "$version" | cut -d' ' -f1)" = "${nuget%% *}" ] ||
              { echo "after the bump, scripts/release.sh nuget $version answers otherwise"; exit 1; }
            git commit -qam "$version: release"
            git tag -a "v$version" -m "Laching $version"
            # The bump and its tag land together or not at all.
            if git push -q --atomic origin HEAD:refs/heads/master "refs/tags/v$version"; then
              gh workflow run pages.yml --ref master  # the site's version label; a push of ours starts nothing
              break
            fi
            # Master moved while this ran: plan again on top of it.
            git tag -d "v$version"
            [ "$attempt" -lt 3 ] || { echo "master kept moving: run the release again"; exit 1; }
            git fetch -q origin master && git reset -q --hard origin/master
          done
          say "Releasing $version ($(git rev-parse HEAD)), tagged v$version"
          out release true
          out version "$version"
          out previous "$previous"
          out ref "$(git rev-parse HEAD)"
          out nuget "$([ "${nuget%% *}" = ship ] && echo true || echo false)"
          out landing "$([ "${landing%% *}" = yes ] && echo true || echo false)"

  # Laching.Core, Laching.Companion, Laching.Companion.Shell and Laching.Testing: tests and the packages, on Linux.
  # Skipped, with windows and the NuGet push, when the packages are unchanged since LachingVersion.
  core:
    needs: version
    if: needs.version.outputs.nuget == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet test dotnet/Laching.Core.Tests/Laching.Core.Tests.csproj -c Release
          dotnet test dotnet/Laching.Companion.Tests/Laching.Companion.Tests.csproj -c Release
          dotnet test dotnet/Laching.Companion.Shell.Tests/Laching.Companion.Shell.Tests.csproj -c Release
          dotnet test dotnet/Laching.Testing.Tests/Laching.Testing.Tests.csproj -c Release

      # Each at the release's version (LachingVersion, from the bump): NuGet would skip an older one as a duplicate.
      - name: Pack Laching.Core, Laching.Companion, Laching.Companion.Shell, Laching.Testing
        run: |
          for project in Laching.Core Laching.Companion Laching.Companion.Shell Laching.Testing; do
            dotnet pack "dotnet/$project/$project.csproj" -c Release -o dotnet/artifacts
            [ -f "dotnet/artifacts/$project.$VERSION.nupkg" ] || { ls dotnet/artifacts; echo "$project isn't $VERSION"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-core
          path: dotnet/artifacts/*.nupkg

  # Laching.Windows and Laching.Windows.Companion need the Windows App SDK's MakePri.exe, so they test and pack on
  # Windows.
  windows:
    needs: version
    if: needs.version.outputs.nuget == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet test dotnet/Laching.Windows.Tests/Laching.Windows.Tests.csproj -c Release
          dotnet test dotnet/Laching.Windows.Companion.Tests/Laching.Windows.Companion.Tests.csproj -c Release

      - name: Pack Laching.Windows, Laching.Windows.Companion
        shell: bash
        run: |
          for project in Laching.Windows Laching.Windows.Companion; do
            dotnet pack "dotnet/$project/$project.csproj" -c Release -o dotnet/artifacts
            [ -f "dotnet/artifacts/$project.$VERSION.nupkg" ] || { ls dotnet/artifacts; echo "$project isn't $VERSION"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-windows
          path: dotnet/artifacts/*.nupkg

  # @laching/landing (tools/landing) at the tag's version: tested and packed here, published to npm by `npm`. Skipped,
  # with `npm`, when tools/landing is unchanged since npm's version.
  landing:
    needs: version
    if: needs.version.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/landing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test and pack
        run: |
          npm ci
          npx tsc --noEmit && npx vp test run
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version
          mkdir -p "$GITHUB_WORKSPACE/npm"
          npm pack --pack-destination "$GITHUB_WORKSPACE/npm"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-landing
          path: npm/*.tgz

  # @laching/landing to npm through Trusted Publishing (OIDC: no stored token; provenance attached), published directly:
  # the human gate is the release's dispatch. npmjs.com holds one trusted publisher for the package: repository
  # vmihalachi/laching, workflow release.yml, environment npm. Its own job, so only it can mint the token; re-run it if
  # it fails. It waits for the .NET jobs that ran, so nothing is published when their tests fail.
  npm:
    needs: [version, core, windows, landing]
    if: >-
      !cancelled() && needs.landing.result == 'success' &&
      (needs.core.result == 'success' || needs.core.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-landing
          path: npm

      # No registry-url: it writes a token line to .npmrc, and there is no token.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Publish @laching/landing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install -g npm@^11.5.1  # trusted publishing
          npm publish ./npm/*.tgz --access public --provenance  # ./: a bare npm/… reads as a GitHub repository
          echo "@laching/landing@$VERSION is published on npm." >> "$GITHUB_STEP_SUMMARY"

  # Runs when the .NET jobs or the landing were skipped (nothing of theirs ships) as well as when they succeeded.
  publish:
    needs: [version, core, windows, landing]
    if: >-
      !cancelled() && needs.version.outputs.release == 'true' &&
      (needs.core.result == 'success' || needs.core.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.landing.result == 'success' || needs.landing.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      LACHING_VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      REF: ${{ needs.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v6
        if: needs.version.outputs.nuget == 'true'
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v7
        if: needs.version.outputs.nuget == 'true'
        with:
          pattern: nupkg-*
          path: dotnet/artifacts
          merge-multiple: true

      # Trusted Publishing: GitHub's OIDC token is exchanged for a one-hour NuGet.org API key scoped to this run.
      # Without the NUGET_USER variable the packages still land on the GitHub release below; set it (and the
      # nuget.org policy) and re-run this workflow to publish them.
      - name: Log in to NuGet.org (Trusted Publishing)
        if: vars.NUGET_USER != '' && needs.version.outputs.nuget == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: needs.version.outputs.nuget == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          ls -l dotnet/artifacts
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::Not pushed to NuGet.org: set the NUGET_USER repository variable to your nuget.org username and add a Trusted Publishing policy there for vmihalachi/laching, workflow release.yml."
            exit 0
          fi
          dotnet nuget push "dotnet/artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The landing's tarball, when this release has one, rides along on the GitHub release.
      - uses: actions/download-artifact@v7
        if: needs.landing.result == 'success'
        with:
          name: npm-landing
          path: npm

      # GitHub's notes from the merged pull requests' titles since the previous tag (categories: .github/release.yml),
      # then what shipped where.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          LANDING: ${{ needs.landing.result }}
          NUGET: ${{ needs.version.outputs.nuget }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$LACHING_VERSION" \
            -f previous_tag_name="v$PREVIOUS" -f target_commitish="$REF" --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "## Packages"
            echo
            if [ "$NUGET" = true ]; then
              echo "- NuGet: the six \`Laching.*\` packages at $LACHING_VERSION"
            else
              at=$(sed -n 's/.*<LachingVersion[^>]*>\([^<]*\)<.*/\1/p' dotnet/Directory.Build.props)
              echo "- NuGet: unchanged, still $at"
            fi
            if [ "$LANDING" = success ]; then
              echo "- \`@laching/landing\` $LACHING_VERSION: published to npm"
            else
              echo "- \`@laching/landing\`: unchanged, not published"
            fi
            echo "- The Swift package and the Kotlin build: this tag"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          if [ -d dotnet/artifacts ]; then assets+=(dotnet/artifacts/*.nupkg); fi
          if [ -d npm ]; then assets+=(npm/*.tgz); fi
          if gh release view "v$LACHING_VERSION" >/dev/null 2>&1; then
            if [ ${#assets[@]} -gt 0 ]; then gh release upload "v$LACHING_VERSION" "${assets[@]}" --clobber; fi
          else
            gh release create "v$LACHING_VERSION" "${assets[@]}" --title "v$LACHING_VERSION" --verify-tag \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

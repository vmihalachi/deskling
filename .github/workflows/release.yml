name: Release

# Every push to master that touches CHANGELOG.md or the version releases what it brought, so nobody tags by hand:
# scripts/release.sh plan decides. A change that bumped the version (Laching.swift and the seven other strings, with
# its CHANGELOG.md section) is tagged at the commit that bumped it; otherwise entries under CHANGELOG.md's Unreleased
# heading get the next version (a patch, or a minor while 0.x when one says **Breaking**), committed to master by
# scripts/release.sh bump, then tagged. Merges that land while a release runs go out together in the next one (one run
# at a time, each on master as it is when it starts). A tag pushed by hand (vX.Y.Z) or a manual run with a version tags
# and releases that commit as before; a manual run without one does what a push does.
#
# Then it packs the NuGet packages, pushes them to NuGet.org through Trusted Publishing (OIDC: no stored key;
# nuget.org → your account → Trusted Publishing → a policy for repository vmihalachi/laching and workflow file
# release.yml, plus the NUGET_USER repository variable set to your nuget.org username) and makes the GitHub release
# with the matching CHANGELOG section. The Swift package needs nothing more than the tag itself; @laching/landing
# (tools/landing) is staged on npm at the release's version for an owner to approve, when tools/landing changed since
# the version npm has (see the version and npm jobs). Before it tags or packs anything, `scripts/verify.sh --version`
# checks the version against the pinned version strings (Laching.swift, LachingInfo.cs, Directory.Build.props,
# site/index.html, README.md) and the CHANGELOG.md section, so no package ships with a Laching.version that says
# otherwise. Tags pushed with the workflow's token start no other workflow, so this run carries the release through.
on:
  push:
    branches:
      - master
    paths:
      - "CHANGELOG.md"
      - "Sources/LachingCore/Laching.swift"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag on this commit and release, without the v (needs its CHANGELOG.md section). Empty: release what master has waiting, as a push does."
        required: false
        type: string

permissions:
  contents: write

# One release at a time; a run waiting behind it is replaced by a newer one, which starts from the newer master.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Decides what to release and tags it (committing the bump first when there is one), and whether @laching/landing
  # ships. release is false when nothing is waiting, and every other job skips.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # queues the next release, and the site after a bump
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      landing: ${{ steps.landing.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the plan and the landing's diff
          # A push or an empty manual run releases master as it is now, not as it was when the run was queued.
          ref: ${{ (github.ref_type == 'branch' && inputs.version == '') && 'master' || '' }}

      - id: plan
        name: Plan, bump and tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          # Tags never move: v$1 goes on $2 unless it is there already, and a v$1 elsewhere stops the release.
          tag() {
            local existing
            existing=$(git ls-remote --tags origin "refs/tags/v$1^{}" | cut -f1)
            [ -n "$existing" ] || existing=$(git ls-remote --tags origin "refs/tags/v$1" | cut -f1)
            if [ -z "$existing" ]; then
              git tag -a "v$1" -m "Laching $1" "$2" && git push origin "v$1"
            elif [ "$existing" != "$2" ]; then
              echo "v$1 already exists at $existing (tags are protected and never move): release the next version"
              return 1
            fi
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v} sha=$GITHUB_SHA
            scripts/verify.sh --version "$version"
          elif [ -n "$VERSION" ]; then
            version=$VERSION sha=$GITHUB_SHA
            scripts/verify.sh --version "$version"
            tag "$version" "$sha"
          else
            for attempt in 1 2 3; do
              plan=$(scripts/release.sh plan)  # set -e stops here when it fails; inside the read below it wouldn't
              read -r action version sha <<< "$plan"
              case $action in
                none)
                  echo "Nothing to release: every version is tagged and CHANGELOG.md's Unreleased section is empty." |
                    tee -a "$GITHUB_STEP_SUMMARY"
                  out release false
                  exit 0 ;;
                tag)
                  # A change bumped the version: release the commit that did. Entries that landed after it go out
                  # in the next run, queued here.
                  more=false
                  if scripts/release.sh pending; then more=true; fi
                  git checkout -q "$sha"
                  scripts/verify.sh --version "$version"
                  tag "$version" "$sha"
                  if [ "$more" = true ]; then gh workflow run release.yml --ref master; fi
                  break ;;
                bump)
                  scripts/release.sh bump "$version"
                  scripts/verify.sh --version "$version"
                  git commit -qam "$version: release"
                  if git push -q origin HEAD:master; then
                    sha=$(git rev-parse HEAD)
                    tag "$version" "$sha"
                    gh workflow run pages.yml --ref master  # the site's version label; a push of ours starts nothing
                    break
                  fi
                  # Master moved while this ran: plan again on top of it.
                  [ "$attempt" -lt 3 ] || { echo "master kept moving; the next push releases it"; exit 1; }
                  git fetch -q origin master && git reset -q --hard origin/master ;;
                *)
                  echo "scripts/release.sh plan said '$plan'"
                  exit 1 ;;
              esac
            done
          fi
          echo "Releasing $version ($sha)" | tee -a "$GITHUB_STEP_SUMMARY"
          out release true
          out version "$version"
          out ref "$sha"

      # @laching/landing ships only when tools/landing changed since the version npm has, so its versions skip the
      # releases that leave it alone. Compared with npm rather than the previous tag: a release whose landing was never
      # staged or approved is caught up by the next one, and a re-run after the approval stages nothing twice.
      - id: landing
        name: Whether tools/landing changed since npm's version
        if: steps.plan.outputs.release == 'true'
        run: |
          published=$(npm view @laching/landing version 2>/dev/null || true)
          if [ -z "$published" ]; then
            changed=true; why="npm has no version of it (or didn't answer)"
          elif ! git rev-parse -q --verify "refs/tags/v$published" >/dev/null; then
            changed=true; why="npm's $published has no tag here"
          elif git diff --quiet "v$published" HEAD -- tools/landing; then
            changed=false; why="tools/landing is unchanged since $published, the version on npm: not staged"
          else
            changed=true; why="tools/landing changed since $published, the version on npm"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "@laching/landing: $why" | tee -a "$GITHUB_STEP_SUMMARY"

  # Laching.Core, Laching.Companion, Laching.Companion.Shell and Laching.Testing: tests and the packages, on Linux.
  core:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet test dotnet/Laching.Core.Tests/Laching.Core.Tests.csproj -c Release
          dotnet test dotnet/Laching.Companion.Tests/Laching.Companion.Tests.csproj -c Release
          dotnet test dotnet/Laching.Companion.Shell.Tests/Laching.Companion.Shell.Tests.csproj -c Release

      - name: Pack Laching.Core, Laching.Companion, Laching.Companion.Shell, Laching.Testing
        run: |
          for project in Laching.Core Laching.Companion Laching.Companion.Shell Laching.Testing; do
            dotnet pack "dotnet/$project/$project.csproj" -c Release \
              -p:LachingVersion=${{ needs.version.outputs.version }} -o dotnet/artifacts
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-core
          path: dotnet/artifacts/*.nupkg

  # Laching.Windows and Laching.Windows.Companion need the Windows App SDK's MakePri.exe, so they test and pack on
  # Windows.
  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet test dotnet/Laching.Windows.Tests/Laching.Windows.Tests.csproj -c Release
          dotnet test dotnet/Laching.Windows.Companion.Tests/Laching.Windows.Companion.Tests.csproj -c Release

      - name: Pack Laching.Windows, Laching.Windows.Companion
        shell: bash
        run: |
          for project in Laching.Windows Laching.Windows.Companion; do
            dotnet pack "dotnet/$project/$project.csproj" -c Release \
              -p:LachingVersion=${{ needs.version.outputs.version }} -o dotnet/artifacts
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-windows
          path: dotnet/artifacts/*.nupkg

  # @laching/landing (tools/landing) at the tag's version: tested and packed here, staged on npm by `npm`. Skipped,
  # with `npm`, when tools/landing is unchanged since npm's version.
  landing:
    needs: version
    if: needs.version.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/landing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test and pack
        run: |
          npm ci
          npx tsc --noEmit && npx vp test run
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version
          mkdir -p "$GITHUB_WORKSPACE/npm"
          npm pack --pack-destination "$GITHUB_WORKSPACE/npm"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-landing
          path: npm/*.tgz

  # @laching/landing to npm through Trusted Publishing (OIDC: no stored token), staged rather than published: nothing
  # goes live until an owner approves it with 2FA (npmjs.com → the package → Staged, or `npm stage approve <id>`).
  # npmjs.com holds one trusted publisher for the package: repository vmihalachi/laching, workflow release.yml,
  # environment npm, stage publish only. Its own job, so only it can mint the token; re-run it if it fails.
  npm:
    needs: [version, core, windows, landing]
    if: needs.version.outputs.landing == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-landing
          path: npm

      # No registry-url: it writes a token line to .npmrc, and there is no token.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Stage @laching/landing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install -g npm@^11.15.0  # staged publishing
          npm stage publish ./npm/*.tgz --access public --provenance  # ./: a bare npm/… reads as a GitHub repository
          {
            echo "@laching/landing@$VERSION is staged on npm. Approve it with 2FA on npmjs.com (the package's Staged tab)"
            echo "or with \`npm stage list @laching/landing\` and \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs when the landing was skipped as well as when it succeeded.
  publish:
    needs: [version, core, windows, landing]
    if: >-
      !cancelled() && needs.core.result == 'success' && needs.windows.result == 'success' &&
      (needs.landing.result == 'success' || needs.landing.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      LACHING_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v7
        with:
          pattern: nupkg-*
          path: dotnet/artifacts
          merge-multiple: true

      # Trusted Publishing: GitHub's OIDC token is exchanged for a one-hour NuGet.org API key scoped to this run.
      # Without the NUGET_USER variable the packages still land on the GitHub release below; set it (and the
      # nuget.org policy) and re-run this workflow to publish them.
      - name: Log in to NuGet.org (Trusted Publishing)
        if: vars.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          ls -l dotnet/artifacts
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::Not pushed to NuGet.org: set the NUGET_USER repository variable to your nuget.org username and add a Trusted Publishing policy there for vmihalachi/laching, workflow release.yml."
            exit 0
          fi
          dotnet nuget push "dotnet/artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The landing's tarball, when this release has one, rides along on the GitHub release.
      - uses: actions/download-artifact@v7
        if: needs.landing.result == 'success'
        with:
          name: npm-landing
          path: npm

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$LACHING_VERSION" '
            /^## / { on = ($2 == v || $2 == "[" v "]") ; next }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dotnet/artifacts/*.nupkg)
          if [ -d npm ]; then assets+=(npm/*.tgz); fi
          if gh release view "v$LACHING_VERSION" >/dev/null 2>&1; then
            gh release upload "v$LACHING_VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$LACHING_VERSION" "${assets[@]}" --title "v$LACHING_VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

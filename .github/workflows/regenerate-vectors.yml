name: Regenerate vectors

# Runs the Swift vector generator on a Mac (the reference platform) and commits the result when it differs,
# for sessions that have no Mac at hand. Manual only: Actions → Regenerate vectors → Run workflow, on a branch.
# It pushes to the branch it runs on, so the first step refuses the default branch: a vector change reaches
# master through a pull request, with CI on it, never from a dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Refuse the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::This workflow pushes to the branch it runs on. Dispatch it on a branch, not ${{ github.ref_name }}; vectors reach it through a pull request."
          exit 1

      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Regenerate conformance/
        run: scripts/conformance.sh

      - name: Commit and push if anything changed
        run: |
          git add -A conformance
          if git diff --cached --quiet; then
            echo "conformance/ is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate conformance vectors" -m "From the Swift reference on $(sw_vers -productVersion) with $(xcodebuild -version | head -1)."
          git push
